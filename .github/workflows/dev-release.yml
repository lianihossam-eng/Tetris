name: Dev Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: dev-release
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            target: x86_64-linux
          - name: linux-aarch64
            target: aarch64-linux
          - name: macos-x86_64
            target: x86_64-macos
          - name: macos-aarch64
            target: aarch64-macos
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: "0.17.0"

      - name: Build dev binary
        run: zig build -Doptimize=ReleaseSafe -Dtarget=${{ matrix.target }} -Dupdate-channel=dev

      - name: Package
        run: |
          package_dir="$RUNNER_TEMP/tetris-package-${{ matrix.name }}"
          mkdir -p "$package_dir"
          cp zig-out/bin/tetris "$package_dir/tetris"
          cp LICENSE THIRD_PARTY_NOTICES.md "$package_dir/"
          tar -czf "tetris-${{ matrix.name }}.tar.gz" -C "$package_dir" tetris LICENSE THIRD_PARTY_NOTICES.md
          sha256sum "tetris-${{ matrix.name }}.tar.gz" > "tetris-${{ matrix.name }}.tar.gz.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tetris-${{ matrix.name }}
          path: |
            tetris-${{ matrix.name }}.tar.gz
            tetris-${{ matrix.name }}.tar.gz.sha256

  web:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    name: Build web artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: "0.17.0"

      - name: Build terminal WASM
        run: zig build -Doptimize=ReleaseSafe -Dwasm-surface=term

      - name: Package web artifacts
        run: |
          cp sdk/fx-sdk.js fx-sdk.js
          cp sdk/core-output.js core-output.js
          cp sdk/tool-observation.js tool-observation.js
          cp sdk/wasm-module.js wasm-module.js
          cp zig-out/bin/fx-term.wasm fx-term.wasm
          sha256sum fx-sdk.js > fx-sdk.js.sha256
          sha256sum core-output.js > core-output.js.sha256
          sha256sum tool-observation.js > tool-observation.js.sha256
          sha256sum wasm-module.js > wasm-module.js.sha256
          sha256sum fx-term.wasm > fx-term.wasm.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fx-web
          path: |
            fx-sdk.js
            fx-sdk.js.sha256
            core-output.js
            core-output.js.sha256
            tool-observation.js
            tool-observation.js.sha256
            wasm-module.js
            wasm-module.js.sha256
            fx-term.wasm
            fx-term.wasm.sha256

  # Tetris publishes immutable prereleases on GitHub. The tag is the full
  # commit SHA, so a dev build never moves and every asset identifies the
  # exact commit it was built from.
  publish:
    needs: [build]
    if: github.repository == 'lianihossam-eng/Tetris'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: tetris-*
          merge-multiple: true

      - name: Verify platform archives
        run: |
          set -euo pipefail

          for PLATFORM in linux-x86_64 linux-aarch64 macos-x86_64 macos-aarch64; do
            ARCHIVE="tetris-${PLATFORM}.tar.gz"
            CHECKSUM="${ARCHIVE}.sha256"
            test -f "$ARCHIVE"
            test -f "$CHECKSUM"
            sha256sum --check "$CHECKSUM"
            tar -tzf "$ARCHIVE" | grep -qx tetris
          done

      - name: Write dev.json
        run: |
          set -euo pipefail

          VERSION=$(grep 'pub const version' src/main.zig | head -1 | sed 's/.*"\(.*\)".*/\1/')
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          jq -n --arg version "$VERSION" --arg commit "$RELEASE_SHA" \
            '{version: $version, commit: $commit}' > dev.json

      - name: Publish GitHub prerelease
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: dev-${{ env.RELEASE_SHA }}
          target_commitish: ${{ env.RELEASE_SHA }}
          name: Dev build ${{ env.RELEASE_SHA }}
          body: Development build for commit ${{ env.RELEASE_SHA }}.
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          files: |
            tetris-*.tar.gz
            tetris-*.tar.gz.sha256
            dev.json

  # Fx keeps publishing its dev builds to the Fx CDN. This job is inert in the
  # Tetris fork so it cannot use Fx's blob token or web deploy hook.
  publish-upstream:
    needs: [build, web]
    if: github.repository == 'vercel-labs/fx'
    runs-on: ubuntu-latest
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
      FX_WEB_DEPLOY_HOOK_URL: ${{ secrets.FX_WEB_DEPLOY_HOOK_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Publish immutable dev artifacts
        run: |
          set -euo pipefail

          for FILE in tetris-*.tar.gz tetris-*.tar.gz.sha256; do
            [ -f "$FILE" ] || continue
            CONTENT_TYPE="application/octet-stream"
            [[ "$FILE" == *.sha256 ]] && CONTENT_TYPE="text/plain"
            [[ "$FILE" == *.tar.gz ]] && CONTENT_TYPE="application/gzip"

            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              -X PUT "https://blob.vercel-storage.com/cli/dev/${RELEASE_SHA}/${FILE}" \
              -H "Authorization: Bearer ${BLOB_READ_WRITE_TOKEN}" \
              -H "x-api-version: 7" \
              -H "x-content-type: ${CONTENT_TYPE}" \
              -H "x-add-random-suffix: 0" \
              -H "x-cache-control-max-age: 31536000" \
              --data-binary "@${FILE}")
            echo "Uploaded ${FILE} for ${RELEASE_SHA} ($HTTP_CODE)"
            if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
              echo "::error::Failed to upload ${FILE} to the dev channel ($HTTP_CODE)"
              exit 1
            fi
          done

      - name: Publish immutable web artifacts
        run: |
          set -euo pipefail

          sha256sum --check fx-sdk.js.sha256
          sha256sum --check core-output.js.sha256
          sha256sum --check tool-observation.js.sha256
          sha256sum --check wasm-module.js.sha256
          sha256sum --check fx-term.wasm.sha256

          for FILE in fx-sdk.js fx-sdk.js.sha256 core-output.js core-output.js.sha256 tool-observation.js tool-observation.js.sha256 wasm-module.js wasm-module.js.sha256 fx-term.wasm fx-term.wasm.sha256; do
            CONTENT_TYPE="application/octet-stream"
            [[ "$FILE" == *.js ]] && CONTENT_TYPE="text/javascript"
            [[ "$FILE" == *.wasm ]] && CONTENT_TYPE="application/wasm"
            [[ "$FILE" == *.sha256 ]] && CONTENT_TYPE="text/plain"

            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              -X PUT "https://blob.vercel-storage.com/cli/dev/${RELEASE_SHA}/web/${FILE}" \
              -H "Authorization: Bearer ${BLOB_READ_WRITE_TOKEN}" \
              -H "x-api-version: 7" \
              -H "x-content-type: ${CONTENT_TYPE}" \
              -H "x-add-random-suffix: 0" \
              -H "x-cache-control-max-age: 31536000" \
              --data-binary "@${FILE}")
            echo "Uploaded web/${FILE} for ${RELEASE_SHA} ($HTTP_CODE)"
            if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
              echo "::error::Failed to upload ${FILE} to the dev web channel ($HTTP_CODE)"
              exit 1
            fi
          done

      - name: Point dev channel at this commit
        id: point-dev
        run: |
          set -euo pipefail
          echo "updated=false" >> "$GITHUB_OUTPUT"

          MAIN_SHA=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$MAIN_SHA" != "$RELEASE_SHA" ]; then
            echo "main advanced to ${MAIN_SHA}; leaving dev.json unchanged"
            exit 0
          fi

          VERSION=$(grep 'pub const version' src/main.zig | head -1 | sed 's/.*"\(.*\)".*/\1/')
          jq -n --arg version "$VERSION" --arg commit "$RELEASE_SHA" \
            '{version: $version, commit: $commit}' > /tmp/dev.json

          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X PUT "https://blob.vercel-storage.com/cli/dev.json" \
            -H "Authorization: Bearer ${BLOB_READ_WRITE_TOKEN}" \
            -H "x-api-version: 7" \
            -H "x-content-type: application/json" \
            -H "x-add-random-suffix: 0" \
            -H "x-cache-control-max-age: 60" \
            --data-binary "@/tmp/dev.json")
          echo "Updated dev.json to ${RELEASE_SHA} ($HTTP_CODE)"
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::Failed to update dev.json ($HTTP_CODE)"
            exit 1
          fi
          echo "updated=true" >> "$GITHUB_OUTPUT"

      - name: Deploy fx-web
        if: steps.point-dev.outputs.updated == 'true' && env.FX_WEB_DEPLOY_HOOK_URL != ''
        run: |
          curl --fail --silent --show-error \
            --retry 3 --retry-all-errors --max-time 30 \
            -X POST "$FX_WEB_DEPLOY_HOOK_URL"
